name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check release safeguards
        run: npm run test:release

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Test the package in an isolated consumer
        run: |
          RELEASE_VERSION=$(node -p "require('./package.json').version")
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/consumer" --no-audit --no-fund "$RUNNER_TEMP/ai-reliability-runtime-$RELEASE_VERSION.tgz"
          node scripts/package-smoke.cjs "$RUNNER_TEMP/consumer"
